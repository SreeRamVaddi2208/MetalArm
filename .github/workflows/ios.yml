# iOS app: unit and UI tests (mock backend) plus an unsigned Release build.
# Kept out of ci.yml because macOS runners cost 10x Actions minutes on a
# private repo: runs on pull requests that touch ios/, on pushes to main, and
# on demand from the Actions tab.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Use whichever iPhone simulator this runner image has, rather than a
      # hard-coded model: images differ, and one had none installed at all.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d["udid"]) for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          print(sorted(phones)[-1][1] if phones else "")'
          }
          udid=$(pick)
          if [ -z "$udid" ]; then
            echo "::warning::No iPhone simulator on this runner; downloading the iOS platform"
            xcodebuild -downloadPlatform iOS
            udid=$(pick)
          fi
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator is available on this runner"
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Unit and UI tests (mock backend)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MetalARM.xcodeproj -scheme MetalARM \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Release build compiles
        run: |
          xcodebuild build \
            -project MetalARM.xcodeproj -scheme MetalARM -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
