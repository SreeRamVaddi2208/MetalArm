# MetalArm CI: backend tests + migration check, and production image builds.
# The iOS app's tests live in ios.yml, which runs only when ios/ changes
# (macOS minutes cost 10x on a private repo).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metalarm
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: metalarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metalarm -d metalarm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: metalarm
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: metalarm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      LOG_LEVEL: warning
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each build is retried once: a dropped connection to Docker Hub while
      # fetching base images is common on shared runners and is not a code fault.
      - name: Backend runtime image
        run: |
          build() { docker build --target runtime -t metalarm-backend:ci backend; }
          build || { echo "::warning::Backend image build failed; retrying once"; sleep 15; build; }
      - name: Frontend image
        run: |
          build() { docker build --build-arg REFLEX_API_URL=https://metalarm.example.com -t metalarm-frontend:ci frontend; }
          build || { echo "::warning::Frontend image build failed; retrying once"; sleep 15; build; }
      - name: Production compose file is valid
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config --quiet
