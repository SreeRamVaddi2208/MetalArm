# MetalArm CI: backend tests + migration check, production image builds, and
# the iOS app's unit and UI tests.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metalarm
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: metalarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metalarm -d metalarm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: metalarm
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: metalarm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      LOG_LEVEL: warning
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend runtime image
        run: docker build --target runtime -t metalarm-backend:ci backend
      - name: Frontend image
        run: docker build --build-arg REFLEX_API_URL=https://metalarm.example.com -t metalarm-frontend:ci frontend
      - name: Production compose file is valid
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config --quiet

  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit and UI tests (mock backend)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MetalARM.xcodeproj -scheme MetalARM \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
      - name: Release build compiles
        run: |
          xcodebuild build \
            -project MetalARM.xcodeproj -scheme MetalARM -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
