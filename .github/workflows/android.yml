# Android app: Android lint, unit tests and an unsigned release build, plus the
# Compose UI tests on an emulator in a second job (the same split as ios.yml,
# so a slow emulator can't hide the unit result). Runs on pull requests that
# touch android/, on pushes to main, and on demand.
#
# The design-token lint for android/ (scripts/check_client_tokens.py) runs in
# ci.yml's frontend job.
name: Android

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint, unit tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests, release build
        run: ./gradlew lint testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-reports
          path: android/app/build/reports

  ui:
    name: UI tests (mock backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-reports
          path: android/app/build/reports/androidTests
