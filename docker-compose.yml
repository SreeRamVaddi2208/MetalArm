# ---------------------------------------------------------------------------
# LevelForge - local development stack.
#
# Every service is INDEPENDENTLY buildable, per Section 6. A broken frontend
# build must never block verification of a working backend:
#     docker compose build backend
#     docker compose up -d postgres redis backend
#     docker compose build frontend
#
# No secrets are inlined. Everything comes from .env (gitignored); see
# .env.example for the template.
# ---------------------------------------------------------------------------

name: levelforge

services:
  postgres:
    image: postgres:17-alpine
    container_name: levelforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback: the datastores must not be reachable from the LAN.
      # Redis in particular runs unauthenticated (it logs a warning saying so),
      # and 0.0.0.0 would expose it to every host on the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d/-U so the check fails if the DB or role is genuinely wrong,
      # not merely if the server socket is listening.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [levelforge]

  redis:
    image: redis:8-alpine
    container_name: levelforge-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--requirepass", "${REDIS_PASSWORD}",
      ]
    ports:
      # Loopback only - see the note on the postgres service.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # -a, or the check fails against a password-protected server.
      # --no-auth-warning keeps the secret out of the container logs.
      test:
        ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [levelforge]

  # Schema migrations. Runs to completion and exits BEFORE the backend
  # starts, so the API never serves against an un-migrated database.
  #
  # Without this, `docker compose up` on a fresh volume gave a backend whose
  # /health said "ok" (SELECT 1 succeeds on an empty database) while every real
  # request failed with `relation "users" does not exist`.
  #
  # `alembic upgrade head` is idempotent - a no-op when already current - so
  # this is safe on every start, not just the first.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    # SAME image tag as the backend, deliberately. They run identical code, and
    # when they were separate images `docker compose build backend` left this
    # one stale - the next `up` then failed with "Can't locate revision", because
    # the old image had no knowledge of a migration the database had already
    # applied. One tag makes that drift impossible.
    image: levelforge-backend
    container_name: levelforge-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Unused by alembic, but Settings requires it at import time.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [levelforge]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # EXPLICIT: the Dockerfile's last stage is `dev` (pytest), and Docker
      # builds the last stage by default. Without this, the shipped runtime
      # image would silently gain a test runner.
      target: runtime
    # Shared with the `migrate` service - see the note there.
    image: levelforge-backend
    container_name: levelforge-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Service name on the compose network, NOT localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Block startup until the schema is actually migrated.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    networks: [levelforge]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-reachable, and baked into the JS bundle at build time.
        REFLEX_API_URL: ${REFLEX_API_URL:-http://localhost:3000}
    container_name: levelforge-frontend
    restart: unless-stopped
    environment:
      REFLEX_API_URL: ${REFLEX_API_URL:-http://localhost:3000}
      # Reflex event handlers run SERVER-side, inside this container, so
      # API calls originate here and not in the browser: the compose service
      # name is correct and `localhost` is wrong - localhost:8000 in here is
      # the Reflex server itself, not the backend.
      # (REFLEX_API_URL above is the opposite: it IS browser-facing.)
      #
      # Fixed, NOT ${LEVELFORGE_API_BASE_URL}. That variable means the
      # browser-reachable URL for a local `reflex run`, and letting .env supply
      # it here silently pointed the container at its own localhost:8000 -
      # every API call failed with ECONNREFUSED while the UI still rendered.
      # This address is a property of the compose network, not user config.
      LEVELFORGE_API_BASE_URL: http://backend:8000
    ports:
      # Single port: in prod Reflex serves UI + state server from one process.
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    # Intentionally NOT depends_on backend: the frontend must be independently
    # runnable against a stub API during early development (Section 4.3).
    healthcheck:
      # Only python3 exists in these images (no curl/wget), so probe with urllib.
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:3000/", timeout=8).status == 200 else 1)
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 40s
    networks: [levelforge]

  # Backend test suite. Behind a profile, so `docker compose up` never starts
  # it and it cannot interfere with the running stack.
  #     docker compose run --rm tests
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Tests run against a SEPARATE database, created and dropped by
      # conftest.py, so a test run can never truncate development data.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: warning
    volumes:
      # Mount the source so editing a test does not require an image rebuild.
      # The venv lives at /opt/venv, outside /app, so it is unaffected.
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [levelforge]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: levelforge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Loopback only: pgAdmin holds database credentials.
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:80/misc/ping", timeout=8).status == 200 else 1)
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 40s
    networks: [levelforge]

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  levelforge:
    driver: bridge
