# Alembic config for LevelForge.
# NOTE: sqlalchemy.url is intentionally left blank. The URL is built from
# environment variables in alembic/env.py so no credential ever lands in a
# committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.19 deprecated the legacy split (on spaces, commas AND colons) for
# prepend_sys_path. `os` uses os.pathsep, which is what the old default meant
# on this platform anyway - so this silences the warning without changing
# behaviour. version_path_separator is the older, narrower setting and is kept
# for the versions directory.
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
