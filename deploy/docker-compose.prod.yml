# ---------------------------------------------------------------------------
# MetalArm - production stack for a single Linux server.
#
#   cp deploy/.env.production.example deploy/.env.production   # fill every CHANGE_ME
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# Differences from the development docker-compose.yml:
#   - Caddy is the ONLY service with published ports (80/443) and terminates
#     HTTPS with automatic Let's Encrypt certificates. Postgres, Redis, the API
#     and the web app are reachable only on the internal network.
#   - ENVIRONMENT=production hides /docs and /openapi.json.
#   - uvicorn trusts X-Forwarded-For from Caddy (--proxy-headers), so rate
#     limits see real client addresses. Safe only because nothing but Caddy
#     can reach the backend.
#   - No pgAdmin, nightly database backups, rotated container logs.
#   - Its own project name, volumes and network: it can run on the same
#     machine as the development stack without touching its data.
# See docs/deployment.md.
# ---------------------------------------------------------------------------

name: metalarm-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env.production}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env.production}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.production}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in deploy/.env.production}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  # The web app's origin; the iOS app is not a browser and needs no CORS entry.
  CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env.production}
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [internal]
    logging: *logging

  # Applies migrations and imports the exercise library, then exits. The
  # backend waits for it, so the API never serves an un-migrated database.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    image: metalarm-backend:prod
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.import_exercises"]
    restart: "no"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  backend:
    image: metalarm-backend:prod
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --workers=${BACKEND_WORKERS:-2}
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    networks: [internal]
    logging: *logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle: the browser reaches Reflex's state server
        # here. Changing DOMAIN needs a rebuild, not just a restart.
        REFLEX_API_URL: https://${DOMAIN}
    image: metalarm-frontend:prod
    restart: unless-stopped
    environment:
      REFLEX_API_URL: https://${DOMAIN}
      # Reflex event handlers run server-side, inside this container.
      METALARM_API_BASE_URL: http://backend:8000
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:3000/", timeout=8).status == 200 else 1)
      interval: 15s
      timeout: 12s
      retries: 6
      start_period: 60s
    networks: [internal]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env.production}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?set SUPPORT_EMAIL in deploy/.env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks: [internal]
    logging: *logging

  # Nightly pg_dump into deploy/backups/, pruned after BACKUP_RETENTION_DAYS.
  # Copy that directory off the server too - a backup on the same disk does
  # not survive losing the disk.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          file=/backups/metalarm-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
          else
            echo "backup FAILED" >&2
            rm -f "$$file"
          fi
          find /backups -name 'metalarm-*.dump' -mtime +$$BACKUP_RETENTION_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
